name: test

on:
  pull_request:
  push:
    branches: [master]

jobs:
  lein-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK and Leiningen
        uses: DeLaGuardo/setup-clojure@12.5
        with:
          lein: latest
      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('project.clj') }}
          restore-keys: |
            ${{ runner.os }}-m2-
      - name: Run tests
        run: lein test
